# DS Shop client config. Copy this folder to the root of your SD card.
# The shop's Settings screen (on its home page) edits and rewrites this file.

# The shop server, and an optional backup (e.g. on a travel hotspot).
# The shop uses whichever one answers, trying the one on the DS's own
# network first.
server=mrego3
port=8888
server2=172.20.50.68
port2=8888

# Shop music (needs /ds-shop/music.bin): music=0 turns it off; volume 0..100
music=1
music_volume=70

# ui=text starts the text interface instead of the graphical shop
# (holding SELECT while the shop starts does too)
ui=graphical

# Reserved (the DS uses its WFC connection settings)
ssid=
download_path=/roms/ds-shop